<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>myIO Bridge Control</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { padding: 1.5rem; background: #f8f9fa; }
    .status-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
    .status-active   { background: #198754; }
    .status-inactive { background: #dc3545; }
    .status-unknown  { background: #6c757d; }
    .config-ta  { height: 320px; font-family: monospace; font-size: 0.82rem; resize: vertical; }
    .log-ta     { height: 300px; font-family: monospace; font-size: 0.78rem; resize: vertical; }
    .disc-log   { height: 160px; font-family: monospace; font-size: 0.82rem; resize: vertical; }
    .save-fb    { font-size: 0.88rem; margin-left: 0.75rem; }

    #bridge-config-popup {
      display: none; position: fixed; z-index: 1050;
      width: 760px; height: 560px; min-width: 420px; min-height: 240px;
      background: #fff; border: 1px solid #dee2e6;
      border-radius: 0.5rem; box-shadow: 0 8px 32px rgba(0,0,0,.2);
      resize: both; overflow: hidden; flex-direction: column;
    }
    #bridge-config-popup.open { display: flex; }
    #bridge-popup-handle {
      cursor: move; background: #6c757d; color: #fff;
      padding: .4rem .75rem; border-radius: .5rem .5rem 0 0;
      display: flex; align-items: center; gap: .5rem;
      user-select: none; flex-shrink: 0;
    }
    #bridge-popup-handle .popup-title { flex: 1; font-weight: 600; font-size: .9rem; }
    #bridge-popup-handle .btn-close-popup {
      background: none; border: none; color: #fff;
      font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 0 .25rem;
    }
    #bridge-popup-body {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      padding: .75rem; overflow: hidden;
    }
    #bridge-config { flex: 1; min-height: 60px; resize: none; font-family: monospace; font-size: 0.82rem; }
    #ve-filter-row { flex-shrink: 0; margin-bottom: .45rem; }
    #bridge-config-visual { flex: 1; min-height: 60px; overflow-y: auto; }
    #bridge-popup-footer {
      display: flex; align-items: center;
      padding-top: .5rem; margin-top: .5rem;
      border-top: 1px solid #dee2e6; flex-shrink: 0;
    }

    /* ===== Visual editor ===== */
    .ve-section { border: 1px solid #dee2e6; border-radius: .375rem; margin-bottom: .4rem; }
    .ve-section-hd {
      background: #f8f9fa; padding: .3rem .65rem; cursor: pointer;
      display: flex; align-items: center; gap: .4rem;
      user-select: none; font-size: .85rem;
    }
    .ve-section-hd:hover { background: #e9ecef; }
    .ve-section-body  { padding: .4rem .65rem; }
    .ve-server > .ve-section-hd { background: #6c757d; color: #fff; border-radius: .375rem .375rem 0 0; }
    .ve-server > .ve-section-hd:hover { background: #5c636a; }
    .ve-subsection { margin-top: .35rem; }
    .ve-row {
      display: flex; align-items: center; gap: .3rem;
      padding: .12rem 0; border-bottom: 1px solid #f0f0f0;
    }
    .ve-row:last-child { border-bottom: none; }
    .ve-row input[type=text], .ve-row input[type=number], .ve-row select {
      font-size: .8rem; padding: .1rem .35rem; height: auto;
      border: 1px solid #ced4da; border-radius: .25rem; background: #fff;
    }
    .ve-id-badge { font-size: .75rem; color: #6c757d; flex-shrink: 0; }
    .ve-name { flex: 1; min-width: 80px; }
    .ve-del {
      color: #dc3545; background: none; border: none;
      font-size: .9rem; line-height: 1; cursor: pointer; flex-shrink: 0; padding: 0 .15rem;
    }
    .ve-del:hover { color: #a71d2a; }
    .ve-count { font-size: .7rem; padding: .05rem .3rem; }
    .ve-hidden { display: none !important; }
    .ve-arrow { font-size: .7rem; flex-shrink: 0; }
    .ve-sep { font-size: .8rem; color: #6c757d; flex-shrink: 0; }
    .ve-add-btn { font-size: .75rem; padding: .1rem .4rem; line-height: 1.4; }
    .ve-srv-fields {
      display: flex; flex-wrap: wrap; gap: .3rem .5rem;
      margin-bottom: .35rem; padding-bottom: .35rem; border-bottom: 1px solid #eee;
    }
    .ve-field { display: flex; flex-direction: column; gap: .05rem; }
    .ve-field label { font-size: .68rem; color: #6c757d; margin: 0; line-height: 1.2; }
    .ve-field input { font-size: .8rem; padding: .1rem .35rem; height: auto; border: 1px solid #ced4da; border-radius: .25rem; }
    .ve-empty { font-size: .78rem; color: #adb5bd; padding: .15rem 0; }
    #ve-add-server-row { margin-top: .35rem; }
    #ve-filter { font-size: .82rem; }
  </style>
</head>
<body>
<div class="container-fluid" style="max-width: 860px;">
  <h4 class="mb-3">myIO Bridge Control</h4>

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <button class="nav-link active" id="tab-bridge" onclick="switchMode('bridge')">Bridge</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="tab-discovery" onclick="switchMode('discovery')">Discovery</button>
    </li>
  </ul>

  <!-- ===== BRIDGE MODE ===== -->
  <div id="mode-bridge">
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title">Bridge státusz</h6>
        <p class="mb-2">
          <span id="status-dot" class="status-dot status-unknown"></span>
          <span id="status-text">–</span>
        </p>
        <button class="btn btn-sm btn-success me-2" onclick="bridgeAction('start')">Start</button>
        <button class="btn btn-sm btn-danger"       onclick="bridgeAction('stop')">Stop</button>
        <div id="bridge-error" class="text-danger small mt-2" style="display:none;"></div>
      </div>
    </div>

    <div class="mb-3">
      <button class="btn btn-sm btn-outline-secondary" onclick="openBridgeConfigPopup()">bridge.json szerkesztése</button>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="d-flex align-items-center mb-2">
          <h6 class="card-title mb-0 me-3">Bridge Log</h6>
          <button class="btn btn-sm btn-outline-secondary me-3" onclick="fetchLog()">Frissítés</button>
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="log-auto" onchange="setLogAuto(this.checked)">
            <label class="form-check-label small" for="log-auto">Auto (3 s)</label>
          </div>
        </div>
        <textarea id="bridge-log" class="form-control log-ta" readonly placeholder="Kattints Frissítés-re…"></textarea>
      </div>
    </div>
  </div>

  <!-- ===== DISCOVERY MODE ===== -->
  <div id="mode-discovery" style="display:none;">
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title">Discovery futtatása</h6>
        <p class="text-warning small mb-2 mb-0">
          <strong>Figyelem:</strong> a Discovery futtatása felülírja a <code>bridge.json</code> konfigurációt.
        </p>
        <button id="btn-discovery" class="btn btn-sm btn-primary mt-2 mb-2" onclick="runDiscovery()">
          <span id="disc-spinner" class="spinner-border spinner-border-sm me-1" style="display:none;"></span>
          Run Discovery
        </button>
        <textarea id="disc-log" class="form-control disc-log" readonly placeholder="Kimenet itt jelenik meg…"></textarea>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title">discovery_input.json</h6>
        <textarea id="disc-config" class="form-control config-ta mb-2" placeholder="Betöltés…"></textarea>
        <button class="btn btn-sm btn-primary" onclick="saveDiscoveryConfig()">Save</button>
        <span id="disc-save-fb" class="save-fb"></span>
      </div>
    </div>
  </div>

</div>

<!-- bridge.json popup szerkesztő -->
<div id="bridge-config-popup">
  <div id="bridge-popup-handle">
    <span class="popup-title">bridge.json</span>
    <div class="btn-group btn-group-sm" role="group">
      <button class="btn btn-outline-light active" id="btn-editor-raw"    onclick="switchBridgeEditorMode('raw')">Raw</button>
      <button class="btn btn-outline-light"        id="btn-editor-visual" onclick="switchBridgeEditorMode('visual')">Vizuális</button>
    </div>
    <button class="btn-close-popup" onclick="closeBridgeConfigPopup()">✕</button>
  </div>
  <div id="bridge-popup-body">
    <textarea id="bridge-config" class="form-control mb-2" placeholder="Betöltés…"></textarea>
    <div id="ve-filter-row" style="display:none;">
      <input id="ve-filter" class="form-control form-control-sm" type="search"
             placeholder="Szűrő (eszköznév / ID)…" oninput="veFilter(this.value)">
    </div>
    <div id="bridge-config-visual" style="display:none;"></div>
    <div id="bridge-popup-footer">
      <button class="btn btn-sm btn-primary" onclick="saveBridgeConfig()">Save</button>
      <span id="bridge-save-fb" class="save-fb"></span>
    </div>
  </div>
</div>

<script>
let mode = 'bridge';
let bridgeActive = false;
let logTimer = null;
let bridgeConfigLoaded = false;
let bridgeEditorMode = 'raw';

// --- Popup drag ---
let dragState = null;

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('bridge-popup-handle').addEventListener('mousedown', e => {
    if (e.target.closest('button')) return;
    const popup = document.getElementById('bridge-config-popup');
    const rect = popup.getBoundingClientRect();
    dragState = { startX: e.clientX, startY: e.clientY, left: rect.left, top: rect.top };
    e.preventDefault();
  });
});
document.addEventListener('mousemove', e => {
  if (!dragState) return;
  const popup = document.getElementById('bridge-config-popup');
  popup.style.left = (dragState.left + e.clientX - dragState.startX) + 'px';
  popup.style.top  = (dragState.top  + e.clientY - dragState.startY) + 'px';
});
document.addEventListener('mouseup', () => { dragState = null; });

async function fetchStatus() {
  try {
    const r = await fetch('/api/bridge/status');
    const d = await r.json();
    bridgeActive = d.status === 'active';
    const dot = document.getElementById('status-dot');
    dot.className = 'status-dot ' + (bridgeActive ? 'status-active' : 'status-inactive');
    document.getElementById('status-text').textContent = d.status;
    const discTab = document.getElementById('tab-discovery');
    discTab.disabled = bridgeActive;
    discTab.title = bridgeActive ? 'A bridge futása közben nem lehet Discovery módba váltani.' : '';
    if (bridgeActive && mode === 'discovery') switchMode('bridge');
  } catch {
    document.getElementById('status-dot').className = 'status-dot status-unknown';
    document.getElementById('status-text').textContent = 'ismeretlen';
  }
}

function switchMode(newMode) {
  if (newMode === 'discovery' && bridgeActive) return;
  mode = newMode;
  document.getElementById('mode-bridge').style.display    = newMode === 'bridge'    ? '' : 'none';
  document.getElementById('mode-discovery').style.display = newMode === 'discovery' ? '' : 'none';
  document.getElementById('tab-bridge').classList.toggle('active',    newMode === 'bridge');
  document.getElementById('tab-discovery').classList.toggle('active', newMode === 'discovery');
  if (newMode === 'discovery') loadDiscoveryConfig();
  else if (bridgeConfigLoaded) loadBridgeConfig();
}

async function bridgeAction(action) {
  const errEl = document.getElementById('bridge-error');
  errEl.style.display = 'none';
  const r = await fetch('/api/bridge/' + action, { method: 'POST' });
  const d = await r.json();
  if (!d.ok) { errEl.textContent = d.error || 'Hiba'; errEl.style.display = ''; }
  await fetchStatus();
}

function openBridgeConfigPopup() {
  const popup = document.getElementById('bridge-config-popup');
  if (!popup.style.left) {
    popup.style.left = Math.max(20, (window.innerWidth - 760) / 2) + 'px';
    popup.style.top  = '80px';
  }
  popup.classList.add('open');
  if (!bridgeConfigLoaded) { bridgeConfigLoaded = true; loadBridgeConfig(); }
}

function closeBridgeConfigPopup() {
  document.getElementById('bridge-config-popup').classList.remove('open');
}

// ===== Visual editor — render =====

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function typeSelectHtml(selected) {
  const types = ['switch','light','number','sensor_output','cover_up','cover_down'];
  return `<select name="dev-type" style="width:110px">${
    types.map(t => `<option value="${t}"${t===(selected||'switch')?' selected':''}>${t}</option>`).join('')
  }</select>`;
}

function endTypeHtml(name, selected) {
  return `<select name="${name}" style="width:58px">
    <option value="pca"${(selected||'pca')==='pca'?' selected':''}>pca</option>
    <option value="relay"${selected==='relay'?' selected':''}>relay</option>
  </select>`;
}

function renderOutputRow(kind, item) {
  const id = item.id ?? '', name = item.name ?? '', type = item.type ?? 'switch';
  const en = item.enabled === true;
  const sensorId = item._sensor_id ?? 0;
  // Pass-through: all _ fields except _sensor_id (which has an explicit input)
  const extra = {};
  for (const k of Object.keys(item)) if (k.startsWith('_') && k !== '_sensor_id') extra[k] = item[k];
  return `<div class="ve-row" data-kind="${kind}" data-extra="${esc(JSON.stringify(extra))}">
  <span class="ve-id-badge">#</span>
  <input type="number" name="dev-id" value="${esc(id)}" min="1" style="width:50px" placeholder="ID">
  <input type="text" class="ve-name" name="dev-name" value="${esc(name)}" placeholder="Név">
  ${typeSelectHtml(type)}
  <span class="ve-id-badge" title="Szenzor ID (0=nincs)">S:</span>
  <input type="number" name="dev-sensor-id" value="${esc(sensorId)}" min="0" style="width:42px" title="Szenzor ID (0=nincs)">
  <input type="checkbox" class="form-check-input" name="dev-enabled"${en?' checked':''} title="Engedélyezett">
  <button class="ve-del" onclick="veDeleteRow(this)" title="Törlés">✕</button>
</div>`;
}

function renderSensorRow(item) {
  const id = item.id ?? '', name = item.name ?? '', en = item.enabled === true;
  return `<div class="ve-row" data-kind="sensors">
  <span class="ve-id-badge">#</span>
  <input type="number" name="dev-id" value="${esc(id)}" min="1" style="width:50px" placeholder="ID">
  <input type="text" class="ve-name" name="dev-name" value="${esc(name)}" placeholder="Név">
  <input type="checkbox" class="form-check-input" name="dev-enabled"${en?' checked':''} title="Engedélyezett">
  <button class="ve-del" onclick="veDeleteRow(this)" title="Törlés">✕</button>
</div>`;
}

function renderCoverRow(item) {
  const id = item.id ?? '', name = item.name ?? '', en = item.enabled === true;
  const timeout = item.motor_timeout_sec ?? 90;
  const up = item.up ?? {}, dn = item.down ?? {};
  // Pass-through _ fields for the cover itself and for each endpoint
  const extra    = {};
  for (const k of Object.keys(item)) if (k.startsWith('_')) extra[k] = item[k];
  const upExtra  = {};
  for (const k of Object.keys(up)) if (k.startsWith('_')) upExtra[k] = up[k];
  const dnExtra  = {};
  for (const k of Object.keys(dn)) if (k.startsWith('_')) dnExtra[k] = dn[k];
  return `<div class="ve-row" data-kind="covers" data-extra="${esc(JSON.stringify(extra))}" data-extra-up="${esc(JSON.stringify(upExtra))}" data-extra-dn="${esc(JSON.stringify(dnExtra))}">
  <input type="text" name="cov-id" value="${esc(id)}" placeholder="ID" style="width:90px">
  <input type="text" class="ve-name" name="dev-name" value="${esc(name)}" placeholder="Név">
  <span class="ve-sep">↑</span>${endTypeHtml('cov-up-type', up.type)}
  <input type="number" name="cov-up-id" value="${esc(up.id??0)}" min="0" style="width:46px">
  <span class="ve-sep">↓</span>${endTypeHtml('cov-down-type', dn.type)}
  <input type="number" name="cov-down-id" value="${esc(dn.id??0)}" min="0" style="width:46px">
  <input type="number" name="cov-timeout" value="${timeout}" min="0" style="width:50px" title="Motor timeout">
  <span class="ve-sep" style="font-size:.72rem">s</span>
  <input type="checkbox" class="form-check-input" name="dev-enabled"${en?' checked':''} title="Engedélyezett">
  <button class="ve-del" onclick="veDeleteRow(this)" title="Törlés">✕</button>
</div>`;
}

function renderSubsection(kind, label, items, renderFn) {
  const rows = items.map(renderFn).join('');
  return `<div class="ve-section ve-subsection" data-kind="${kind}">
  <div class="ve-section-hd" onclick="veToggleSection(this)">
    <span class="ve-arrow">▼</span>
    <span class="flex-grow-1">${label}&nbsp;<span class="badge bg-secondary ve-count">${items.length}</span></span>
    <button class="btn btn-outline-secondary ve-add-btn" onclick="veAddDevice(this,'${kind}');event.stopPropagation()">+ Hozzáad</button>
  </div>
  <div class="ve-section-body">${rows || '<div class="ve-empty">Nincs bejegyzés</div>'}</div>
</div>`;
}

function renderServerSection(srv) {
  const id = srv.id ?? '', host = srv.host ?? '';
  const port = srv.port ?? 80, user = srv.user ?? 'admin';
  const pass = srv.password ?? 'admin', interval = srv.poll_interval_sec ?? 2;
  return `<div class="ve-section ve-server">
  <div class="ve-section-hd" onclick="veToggleSection(this)">
    <span class="ve-arrow">▼</span>
    <strong class="flex-grow-1 ve-srv-title">Szerver: ${esc(id)}&nbsp;<span class="fw-normal opacity-75 ve-srv-host">(${esc(host)})</span></strong>
    <button class="btn btn-outline-light ve-add-btn" onclick="veDeleteServer(this);event.stopPropagation()">✕</button>
  </div>
  <div class="ve-section-body">
    <div class="ve-srv-fields">
      <div class="ve-field"><label>ID</label><input type="text" name="srv-id" value="${esc(id)}" style="width:110px" oninput="veUpdateSrvHeader(this)"></div>
      <div class="ve-field"><label>Host</label><input type="text" name="srv-host" value="${esc(host)}" style="width:140px" oninput="veUpdateSrvHeader(this)"></div>
      <div class="ve-field"><label>Port</label><input type="number" name="srv-port" value="${port}" min="1" max="65535" style="width:65px"></div>
      <div class="ve-field"><label>User</label><input type="text" name="srv-user" value="${esc(user)}" style="width:90px"></div>
      <div class="ve-field"><label>Jelszó</label><input type="password" name="srv-password" value="${esc(pass)}" style="width:90px"></div>
      <div class="ve-field"><label>Int. (s)</label><input type="number" name="srv-interval" value="${interval}" min="1" style="width:60px"></div>
    </div>
    ${renderSubsection('pca',    'PCA kimenetek', srv.pca     ?? [], renderOutputRow.bind(null,'pca'))}
    ${renderSubsection('relays', 'Relék',         srv.relays  ?? [], renderOutputRow.bind(null,'relays'))}
    ${renderSubsection('pwm',    'PWM',           srv.pwm     ?? [], renderOutputRow.bind(null,'pwm'))}
    ${renderSubsection('sensors','Érzékelők',     srv.sensors ?? [], renderSensorRow)}
    ${renderSubsection('covers', 'Redők',         srv.covers  ?? [], renderCoverRow)}
  </div>
</div>`;
}

function renderMqttSection(mqtt) {
  const h=mqtt.host??'localhost', p=mqtt.port??1883, c=mqtt.client_id??'myio_bridge';
  const u=mqtt.user??'', pw=mqtt.password??'', pf=mqtt.topic_prefix??'myio';
  return `<div class="ve-section" id="ve-mqtt">
  <div class="ve-section-hd" onclick="veToggleSection(this)">
    <span class="ve-arrow">▼</span><strong>MQTT</strong>
  </div>
  <div class="ve-section-body">
    <div class="ve-srv-fields" style="border-bottom:none;margin-bottom:0;padding-bottom:0;">
      <div class="ve-field"><label>Host</label><input type="text" name="mqtt-host" value="${esc(h)}" style="width:130px"></div>
      <div class="ve-field"><label>Port</label><input type="number" name="mqtt-port" value="${p}" min="1" max="65535" style="width:70px"></div>
      <div class="ve-field"><label>Client ID</label><input type="text" name="mqtt-client" value="${esc(c)}" style="width:130px"></div>
      <div class="ve-field"><label>User</label><input type="text" name="mqtt-user" value="${esc(u)}" style="width:100px"></div>
      <div class="ve-field"><label>Jelszó</label><input type="password" name="mqtt-password" value="${esc(pw)}" style="width:100px"></div>
      <div class="ve-field"><label>Prefix</label><input type="text" name="mqtt-prefix" value="${esc(pf)}" style="width:80px"></div>
    </div>
  </div>
</div>`;
}

function renderBridgeVisualEditor(cfg) {
  if (!cfg || typeof cfg !== 'object' || Array.isArray(cfg)) cfg = {};
  const servers = Array.isArray(cfg.servers) ? cfg.servers : [];
  let html = renderMqttSection(cfg.mqtt ?? {});
  servers.forEach(srv => { html += renderServerSection(srv); });
  html += `<div id="ve-add-server-row" style="margin-top:.35rem;">
    <button class="btn btn-sm btn-outline-secondary ve-add-btn" onclick="veAddServer()">+ Szerver</button>
  </div>`;
  document.getElementById('bridge-config-visual').innerHTML = html;
  document.getElementById('ve-filter').value = '';
}

// ===== Visual editor — collect =====

function collectBridgeEditorData() {
  const cfg = {};

  const mqttBody = document.querySelector('#ve-mqtt .ve-section-body');
  if (mqttBody) {
    const port = parseInt(mqttBody.querySelector('[name=mqtt-port]').value);
    cfg.mqtt = {
      host:         mqttBody.querySelector('[name=mqtt-host]').value,
      port:         isNaN(port) ? 1883 : port,
      client_id:    mqttBody.querySelector('[name=mqtt-client]').value,
      user:         mqttBody.querySelector('[name=mqtt-user]').value,
      password:     mqttBody.querySelector('[name=mqtt-password]').value,
      topic_prefix: mqttBody.querySelector('[name=mqtt-prefix]').value
    };
  }

  cfg.servers = [];
  document.querySelectorAll('.ve-server').forEach(srvEl => {
    const body = srvEl.querySelector(':scope > .ve-section-body');
    const id   = body.querySelector('[name=srv-id]').value.trim();
    const host = body.querySelector('[name=srv-host]').value.trim();
    if (!id || !host) return;

    const srv = {
      id, host,
      port:             parseInt(body.querySelector('[name=srv-port]').value)     || 80,
      user:             body.querySelector('[name=srv-user]').value,
      password:         body.querySelector('[name=srv-password]').value,
      poll_interval_sec: parseInt(body.querySelector('[name=srv-interval]').value) || 2
    };

    for (const kind of ['pca','relays','pwm']) {
      const arr = [];
      srvEl.querySelectorAll(`.ve-row[data-kind="${kind}"]`).forEach(row => {
        const devId = parseInt(row.querySelector('[name=dev-id]').value);
        if (devId > 0) {
          const extra    = JSON.parse(row.dataset.extra || '{}');
          const sensorId = parseInt(row.querySelector('[name=dev-sensor-id]').value) || 0;
          const item = {
            id:      devId,
            name:    row.querySelector('[name=dev-name]').value,
            type:    row.querySelector('[name=dev-type]').value || 'switch',
            enabled: row.querySelector('[name=dev-enabled]').checked,
            ...extra,
          };
          if (sensorId > 0) item._sensor_id = sensorId;
          arr.push(item);
        }
      });
      if (arr.length) srv[kind] = arr;
    }

    const sensors = [];
    srvEl.querySelectorAll('.ve-row[data-kind="sensors"]').forEach(row => {
      const devId = parseInt(row.querySelector('[name=dev-id]').value);
      if (devId > 0) sensors.push({
        id:      devId,
        name:    row.querySelector('[name=dev-name]').value,
        enabled: row.querySelector('[name=dev-enabled]').checked
      });
    });
    if (sensors.length) srv.sensors = sensors;

    const covers = [];
    srvEl.querySelectorAll('.ve-row[data-kind="covers"]').forEach(row => {
      const covId = row.querySelector('[name=cov-id]').value.trim();
      if (!covId) return;
      const upId    = parseInt(row.querySelector('[name=cov-up-id]').value)   || 0;
      const dnId    = parseInt(row.querySelector('[name=cov-down-id]').value) || 0;
      const extra   = JSON.parse(row.dataset.extra   || '{}');
      const upExtra = JSON.parse(row.dataset.extraUp || '{}');
      const dnExtra = JSON.parse(row.dataset.extraDn || '{}');
      const cov = {
        id:               covId,
        name:             row.querySelector('[name=dev-name]').value,
        enabled:          row.querySelector('[name=dev-enabled]').checked,
        motor_timeout_sec: parseInt(row.querySelector('[name=cov-timeout]').value) || 90,
        up: { type: row.querySelector('[name=cov-up-type]').value || 'pca', id: upId, ...upExtra },
        ...extra,
      };
      if (dnId > 0) cov.down = { type: row.querySelector('[name=cov-down-type]').value || 'pca', id: dnId, ...dnExtra };
      covers.push(cov);
    });
    if (covers.length) srv.covers = covers;

    cfg.servers.push(srv);
  });

  return cfg;
}

// ===== Visual editor — actions =====

function veToggleSection(hd) {
  const body  = hd.nextElementSibling;
  const arrow = hd.querySelector('.ve-arrow');
  const open  = body.style.display !== 'none';
  body.style.display = open ? 'none' : '';
  arrow.textContent  = open ? '▶' : '▼';
}

function veDeleteRow(btn) {
  const row = btn.closest('.ve-row');
  const sub = row.closest('.ve-subsection');
  row.remove();
  if (sub) {
    const body  = sub.querySelector('.ve-section-body');
    const count = body.querySelectorAll('.ve-row').length;
    sub.querySelector('.ve-count').textContent = count;
    if (!count) body.innerHTML = '<div class="ve-empty">Nincs bejegyzés</div>';
  }
}

function veDeleteServer(btn) {
  if (confirm('Törlöd ezt a szervert?')) btn.closest('.ve-server').remove();
}

function veAddDevice(btn, kind) {
  const sub  = btn.closest('.ve-subsection');
  const body = sub.querySelector('.ve-section-body');
  // Ensure subsection open
  if (body.style.display === 'none') veToggleSection(sub.querySelector('.ve-section-hd'));
  // Remove empty placeholder
  const empty = body.querySelector('.ve-empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  let html;
  if      (kind === 'sensors') html = renderSensorRow({});
  else if (kind === 'covers')  html = renderCoverRow({});
  else                         html = renderOutputRow(kind, {});
  div.innerHTML = html.trim();
  body.appendChild(div.firstElementChild);

  sub.querySelector('.ve-count').textContent = body.querySelectorAll('.ve-row').length;
  const newRow = body.lastElementChild;
  (newRow.querySelector('[name=dev-id]') || newRow.querySelector('[name=cov-id]'))?.focus();
  newRow.scrollIntoView({ block: 'nearest' });
}

function veAddServer() {
  const ve     = document.getElementById('bridge-config-visual');
  const addRow = document.getElementById('ve-add-server-row');
  const div    = document.createElement('div');
  div.innerHTML = renderServerSection({}).trim();
  ve.insertBefore(div.firstElementChild, addRow);
  const newSrv = addRow.previousElementSibling;
  newSrv.querySelector('[name=srv-id]')?.focus();
}

function veUpdateSrvHeader(input) {
  const srv  = input.closest('.ve-server');
  const id   = srv.querySelector('[name=srv-id]').value   || '(új)';
  const host = srv.querySelector('[name=srv-host]').value || '–';
  const title = srv.querySelector('.ve-srv-title');
  title.childNodes[0].textContent = 'Szerver: ' + id + ' ';
  srv.querySelector('.ve-srv-host').textContent = '(' + host + ')';
}

function veFilter(q) {
  const lower = q.trim().toLowerCase();
  document.querySelectorAll('#bridge-config-visual .ve-row').forEach(row => {
    if (!lower) { row.classList.remove('ve-hidden'); return; }
    const name  = (row.querySelector('[name=dev-name]')?.value  || '').toLowerCase();
    const covId = (row.querySelector('[name=cov-id]')?.value    || '').toLowerCase();
    const devId = String(row.querySelector('[name=dev-id]')?.value || '').toLowerCase();
    row.classList.toggle('ve-hidden', !name.includes(lower) && !covId.includes(lower) && !devId.includes(lower));
  });
}

// ===== Editor mode & API =====

function switchBridgeEditorMode(newMode) {
  if (newMode === bridgeEditorMode) return;
  const fb = document.getElementById('bridge-save-fb');
  fb.textContent = '';

  if (newMode === 'visual') {
    const rawVal = document.getElementById('bridge-config').value;
    let data;
    try { data = JSON.parse(rawVal); } catch (e) {
      fb.textContent = 'Javítsd előbb a JSON hibát Raw módban: ' + e.message;
      fb.style.color = 'red'; return;
    }
    renderBridgeVisualEditor(data);
    document.getElementById('bridge-config').style.display        = 'none';
    document.getElementById('ve-filter-row').style.display        = '';
    document.getElementById('bridge-config-visual').style.display = '';
  } else {
    let content;
    try { content = JSON.stringify(collectBridgeEditorData(), null, 2); } catch (e) {
      fb.textContent = 'Hiba: ' + e.message; fb.style.color = 'red'; return;
    }
    document.getElementById('bridge-config').value                = content;
    document.getElementById('ve-filter-row').style.display        = 'none';
    document.getElementById('bridge-config-visual').style.display = 'none';
    document.getElementById('bridge-config').style.display        = '';
  }

  bridgeEditorMode = newMode;
  document.getElementById('btn-editor-raw').classList.toggle('active',    newMode === 'raw');
  document.getElementById('btn-editor-visual').classList.toggle('active', newMode === 'visual');
}

async function loadBridgeConfig() {
  const r = await fetch('/api/config/bridge');
  const d = await r.json();
  const content = d.ok ? d.content : ('Hiba: ' + d.error);
  document.getElementById('bridge-config').value = content;
  document.getElementById('bridge-save-fb').textContent = '';
  if (bridgeEditorMode === 'visual' && d.ok) {
    try { renderBridgeVisualEditor(JSON.parse(content)); } catch {}
  }
}

async function saveBridgeConfig() {
  const fb = document.getElementById('bridge-save-fb');
  let content;
  if (bridgeEditorMode === 'visual') {
    try { content = JSON.stringify(collectBridgeEditorData(), null, 2); } catch (e) {
      fb.textContent = 'Hiba: ' + e.message; fb.style.color = 'red'; return;
    }
  } else {
    content = document.getElementById('bridge-config').value;
    try { JSON.parse(content); } catch (e) {
      fb.textContent = 'Érvénytelen JSON: ' + e.message; fb.style.color = 'red'; return;
    }
  }
  const r = await fetch('/api/config/bridge', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: content
  });
  const d = await r.json();
  fb.textContent = d.ok ? 'Mentve.' : ('Hiba: ' + (d.error || '?'));
  fb.style.color = d.ok ? 'green' : 'red';
}

async function loadDiscoveryConfig() {
  const r = await fetch('/api/config/discovery');
  const d = await r.json();
  document.getElementById('disc-config').value = d.ok ? d.content : ('Hiba: ' + d.error);
  document.getElementById('disc-save-fb').textContent = '';
}

async function saveDiscoveryConfig() {
  const fb = document.getElementById('disc-save-fb');
  const content = document.getElementById('disc-config').value;
  try { JSON.parse(content); } catch (e) {
    fb.textContent = 'Érvénytelen JSON: ' + e.message; fb.style.color = 'red'; return;
  }
  const r = await fetch('/api/config/discovery', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: content
  });
  const d = await r.json();
  fb.textContent = d.ok ? 'Mentve.' : ('Hiba: ' + (d.error || '?'));
  fb.style.color = d.ok ? 'green' : 'red';
}

async function runDiscovery() {
  if (!confirm('Figyelem: a Discovery futtatása felülírja a bridge.json konfigurációt!\n\nBiztosan folytatod?')) return;
  const btn = document.getElementById('btn-discovery');
  const spinner = document.getElementById('disc-spinner');
  const log = document.getElementById('disc-log');
  btn.disabled = true; spinner.style.display = ''; log.value = 'Futás…';
  try {
    const r = await fetch('/api/discovery/run', { method: 'POST' });
    const d = await r.json();
    log.value = d.output || (d.ok ? 'Kész.' : 'Hiba.');
  } catch (e) {
    log.value = 'Hálózati hiba: ' + e;
  } finally {
    btn.disabled = false; spinner.style.display = 'none';
  }
}

async function fetchLog() {
  const el = document.getElementById('bridge-log');
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 10;
  try {
    const r = await fetch('/api/bridge/log');
    const d = await r.json();
    if (d.ok) { el.value = d.lines; if (atBottom) el.scrollTop = el.scrollHeight; }
  } catch {}
}

function setLogAuto(on) {
  clearInterval(logTimer); logTimer = null;
  if (on) { fetchLog(); logTimer = setInterval(fetchLog, 3000); }
}

fetchStatus();
setInterval(fetchStatus, 5000);
</script>
