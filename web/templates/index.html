<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>myIO Bridge Control</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { padding: 1.5rem; background: #f8f9fa; }
    .status-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
    .status-active   { background: #198754; }
    .status-inactive { background: #dc3545; }
    .status-unknown  { background: #6c757d; }
    .config-ta  { height: 320px; font-family: monospace; font-size: 0.82rem; resize: vertical; }
    .log-ta     { height: 300px; font-family: monospace; font-size: 0.78rem; resize: vertical; }
    .disc-log   { height: 160px; font-family: monospace; font-size: 0.82rem; resize: vertical; }
    .save-fb    { font-size: 0.88rem; margin-left: 0.75rem; }
    .jsoneditor { border: 1px solid #dee2e6 !important; border-radius: 0.375rem !important; }
    .jsoneditor-menu { background-color: #6c757d !important; border-bottom: 1px solid #5c636a !important; border-radius: 0.375rem 0.375rem 0 0 !important; }

    #bridge-config-popup {
      display: none; position: fixed; z-index: 1050;
      width: 640px; height: 500px; min-width: 360px; min-height: 220px;
      background: #fff; border: 1px solid #dee2e6;
      border-radius: 0.5rem; box-shadow: 0 8px 32px rgba(0,0,0,.2);
      resize: both; overflow: hidden; flex-direction: column;
    }
    #bridge-config-popup.open { display: flex; }
    #bridge-popup-handle {
      cursor: move; background: #6c757d; color: #fff;
      padding: .4rem .75rem; border-radius: .5rem .5rem 0 0;
      display: flex; align-items: center; gap: .5rem;
      user-select: none; flex-shrink: 0;
    }
    #bridge-popup-handle .popup-title { flex: 1; font-weight: 600; font-size: .9rem; }
    #bridge-popup-handle .btn-close-popup {
      background: none; border: none; color: #fff;
      font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 0 .25rem;
    }
    #bridge-popup-body {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      padding: .75rem; overflow: hidden;
    }
    #bridge-config {
      flex: 1; min-height: 60px; resize: none;
      font-family: monospace; font-size: 0.82rem;
    }
    #bridge-config-visual { flex: 1; min-height: 60px; border-radius: 0.375rem; overflow: hidden; }
    #bridge-popup-footer {
      display: flex; align-items: center;
      padding-top: .5rem; margin-top: .5rem;
      border-top: 1px solid #dee2e6; flex-shrink: 0;
    }
  </style>
</head>
<body>
<div class="container-fluid" style="max-width: 860px;">
  <h4 class="mb-3">myIO Bridge Control</h4>

  <!-- Mode tabs -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <button class="nav-link active" id="tab-bridge" onclick="switchMode('bridge')">Bridge</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="tab-discovery" onclick="switchMode('discovery')">Discovery</button>
    </li>
  </ul>

  <!-- ===== BRIDGE MODE ===== -->
  <div id="mode-bridge">
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title">Bridge státusz</h6>
        <p class="mb-2">
          <span id="status-dot" class="status-dot status-unknown"></span>
          <span id="status-text">–</span>
        </p>
        <button class="btn btn-sm btn-success me-2" onclick="bridgeAction('start')">Start</button>
        <button class="btn btn-sm btn-danger"       onclick="bridgeAction('stop')">Stop</button>
        <div id="bridge-error" class="text-danger small mt-2" style="display:none;"></div>
      </div>
    </div>

    <div class="mb-3">
      <button class="btn btn-sm btn-outline-secondary" onclick="openBridgeConfigPopup()">bridge.json szerkesztése</button>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="d-flex align-items-center mb-2">
          <h6 class="card-title mb-0 me-3">Bridge Log</h6>
          <button class="btn btn-sm btn-outline-secondary me-3" onclick="fetchLog()">Frissítés</button>
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="log-auto" onchange="setLogAuto(this.checked)">
            <label class="form-check-label small" for="log-auto">Auto (3 s)</label>
          </div>
        </div>
        <textarea id="bridge-log" class="form-control log-ta" readonly placeholder="Kattints Frissítés-re…"></textarea>
      </div>
    </div>
  </div>

  <!-- ===== DISCOVERY MODE ===== -->
  <div id="mode-discovery" style="display:none;">
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title">Discovery futtatása</h6>
        <p class="text-warning small mb-2 mb-0">
          <strong>Figyelem:</strong> a Discovery futtatása felülírja a <code>bridge.json</code> konfigurációt.
        </p>
        <button id="btn-discovery" class="btn btn-sm btn-primary mt-2 mb-2" onclick="runDiscovery()">
          <span id="disc-spinner" class="spinner-border spinner-border-sm me-1" style="display:none;"></span>
          Run Discovery
        </button>
        <textarea id="disc-log" class="form-control disc-log" readonly placeholder="Kimenet itt jelenik meg…"></textarea>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title">discovery_input.json</h6>
        <textarea id="disc-config" class="form-control config-ta mb-2" placeholder="Betöltés…"></textarea>
        <button class="btn btn-sm btn-primary" onclick="saveDiscoveryConfig()">Save</button>
        <span id="disc-save-fb" class="save-fb"></span>
      </div>
    </div>
  </div>

</div>

<!-- bridge.json popup szerkesztő -->
<div id="bridge-config-popup">
  <div id="bridge-popup-handle">
    <span class="popup-title">bridge.json</span>
    <div class="btn-group btn-group-sm" role="group">
      <button class="btn btn-outline-light active" id="btn-editor-raw"    onclick="switchBridgeEditorMode('raw')">Raw</button>
      <button class="btn btn-outline-light"        id="btn-editor-visual" onclick="switchBridgeEditorMode('visual')">Vizuális</button>
    </div>
    <button class="btn-close-popup" onclick="closeBridgeConfigPopup()">✕</button>
  </div>
  <div id="bridge-popup-body">
    <textarea id="bridge-config" class="form-control mb-2" placeholder="Betöltés…"></textarea>
    <div id="bridge-config-visual" class="mb-2" style="display:none;"></div>
    <div id="bridge-popup-footer">
      <button class="btn btn-sm btn-primary" onclick="saveBridgeConfig()">Save</button>
      <span id="bridge-save-fb" class="save-fb"></span>
    </div>
  </div>
</div>

<script>
let mode = 'bridge';
let bridgeActive = false;
let logTimer = null;
let bridgeConfigLoaded = false;
let bridgeEditorMode = 'raw';
let jsonEditor = null;
let jsonEditorLoading = false;
let jsonEditorLoaded = false;

// --- Popup drag ---
let dragState = null;

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('bridge-popup-handle').addEventListener('mousedown', e => {
    if (e.target.closest('button')) return;
    const popup = document.getElementById('bridge-config-popup');
    const rect = popup.getBoundingClientRect();
    dragState = { startX: e.clientX, startY: e.clientY, left: rect.left, top: rect.top };
    e.preventDefault();
  });
});

document.addEventListener('mousemove', e => {
  if (!dragState) return;
  const popup = document.getElementById('bridge-config-popup');
  popup.style.left = (dragState.left + e.clientX - dragState.startX) + 'px';
  popup.style.top  = (dragState.top  + e.clientY - dragState.startY) + 'px';
});

document.addEventListener('mouseup', () => { dragState = null; });

async function fetchStatus() {
  try {
    const r = await fetch('/api/bridge/status');
    const d = await r.json();
    bridgeActive = d.status === 'active';
    const dot = document.getElementById('status-dot');
    dot.className = 'status-dot ' + (bridgeActive ? 'status-active' : 'status-inactive');
    document.getElementById('status-text').textContent = d.status;
    const discTab = document.getElementById('tab-discovery');
    discTab.disabled = bridgeActive;
    discTab.title = bridgeActive ? 'A bridge futása közben nem lehet Discovery módba váltani.' : '';
    if (bridgeActive && mode === 'discovery') switchMode('bridge');
  } catch {
    document.getElementById('status-dot').className = 'status-dot status-unknown';
    document.getElementById('status-text').textContent = 'ismeretlen';
  }
}

function switchMode(newMode) {
  if (newMode === 'discovery' && bridgeActive) return;
  mode = newMode;
  document.getElementById('mode-bridge').style.display    = newMode === 'bridge'    ? '' : 'none';
  document.getElementById('mode-discovery').style.display = newMode === 'discovery' ? '' : 'none';
  document.getElementById('tab-bridge').classList.toggle('active',    newMode === 'bridge');
  document.getElementById('tab-discovery').classList.toggle('active', newMode === 'discovery');
  if (newMode === 'discovery') loadDiscoveryConfig();
  else if (bridgeConfigLoaded) loadBridgeConfig();
}

async function bridgeAction(action) {
  const errEl = document.getElementById('bridge-error');
  errEl.style.display = 'none';
  const r = await fetch('/api/bridge/' + action, { method: 'POST' });
  const d = await r.json();
  if (!d.ok) { errEl.textContent = d.error || 'Hiba'; errEl.style.display = ''; }
  await fetchStatus();
}

function openBridgeConfigPopup() {
  const popup = document.getElementById('bridge-config-popup');
  if (!popup.style.left) {
    popup.style.left = Math.max(20, (window.innerWidth - 640) / 2) + 'px';
    popup.style.top  = '80px';
  }
  popup.classList.add('open');
  if (!bridgeConfigLoaded) { bridgeConfigLoaded = true; loadBridgeConfig(); }
}

function closeBridgeConfigPopup() {
  document.getElementById('bridge-config-popup').classList.remove('open');
}

function loadJsonEditorLib() {
  if (jsonEditorLoaded) return Promise.resolve();
  if (jsonEditorLoading) return new Promise(resolve => {
    const check = setInterval(() => { if (jsonEditorLoaded) { clearInterval(check); resolve(); } }, 50);
  });
  jsonEditorLoading = true;
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://cdn.jsdelivr.net/npm/jsoneditor@10/dist/jsoneditor.min.css';
  document.head.appendChild(link);
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/jsoneditor@10/dist/jsoneditor.min.js';
    script.onload = () => { jsonEditorLoaded = true; resolve(); };
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

async function switchBridgeEditorMode(newMode) {
  if (newMode === bridgeEditorMode) return;
  const fb = document.getElementById('bridge-save-fb');
  fb.textContent = '';

  if (newMode === 'visual') {
    const rawValue = document.getElementById('bridge-config').value;
    let data;
    try { data = JSON.parse(rawValue); } catch (e) {
      fb.textContent = 'Javítsd előbb a JSON hibát Raw módban: ' + e.message;
      fb.style.color = 'red';
      return;
    }
    try { await loadJsonEditorLib(); } catch {
      fb.textContent = 'A vizuális szerkesztő nem töltődött be (hálózati hiba).';
      fb.style.color = 'red';
      return;
    }
    if (!jsonEditor) {
      jsonEditor = new JSONEditor(document.getElementById('bridge-config-visual'), {
        mode: 'tree',
        modes: ['tree', 'view'],
        onError: err => {
          const f = document.getElementById('bridge-save-fb');
          f.textContent = 'Szerkesztő hiba: ' + err.message;
          f.style.color = 'red';
        }
      });
    }
    jsonEditor.set(data);
    jsonEditor.expandAll();
    document.getElementById('bridge-config').style.display = 'none';
    document.getElementById('bridge-config-visual').style.display = '';
  } else {
    if (jsonEditor) {
      try {
        const data = jsonEditor.get();
        document.getElementById('bridge-config').value = JSON.stringify(data, null, 2);
      } catch (e) {
        fb.textContent = 'Vizuális szerkesztő hibás állapotban: ' + e.message;
        fb.style.color = 'red';
        return;
      }
    }
    document.getElementById('bridge-config-visual').style.display = 'none';
    document.getElementById('bridge-config').style.display = '';
  }

  bridgeEditorMode = newMode;
  document.getElementById('btn-editor-raw').classList.toggle('active',    newMode === 'raw');
  document.getElementById('btn-editor-visual').classList.toggle('active', newMode === 'visual');
}

async function loadBridgeConfig() {
  const r = await fetch('/api/config/bridge');
  const d = await r.json();
  const content = d.ok ? d.content : ('Hiba: ' + d.error);
  document.getElementById('bridge-config').value = content;
  document.getElementById('bridge-save-fb').textContent = '';
  if (bridgeEditorMode === 'visual' && jsonEditor && d.ok) {
    try { jsonEditor.set(JSON.parse(content)); jsonEditor.expandAll(); } catch {}
  }
}

async function saveBridgeConfig() {
  const fb = document.getElementById('bridge-save-fb');
  let content;
  if (bridgeEditorMode === 'visual' && jsonEditor) {
    try { content = JSON.stringify(jsonEditor.get(), null, 2); } catch (e) {
      fb.textContent = 'Hiba: ' + e.message; fb.style.color = 'red'; return;
    }
  } else {
    content = document.getElementById('bridge-config').value;
    try { JSON.parse(content); } catch (e) {
      fb.textContent = 'Érvénytelen JSON: ' + e.message; fb.style.color = 'red'; return;
    }
  }
  const r = await fetch('/api/config/bridge', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: content
  });
  const d = await r.json();
  fb.textContent = d.ok ? 'Mentve.' : ('Hiba: ' + (d.error || '?'));
  fb.style.color = d.ok ? 'green' : 'red';
}

async function loadDiscoveryConfig() {
  const r = await fetch('/api/config/discovery');
  const d = await r.json();
  document.getElementById('disc-config').value = d.ok ? d.content : ('Hiba: ' + d.error);
  document.getElementById('disc-save-fb').textContent = '';
}

async function saveDiscoveryConfig() {
  const fb = document.getElementById('disc-save-fb');
  const content = document.getElementById('disc-config').value;
  try { JSON.parse(content); } catch (e) {
    fb.textContent = 'Érvénytelen JSON: ' + e.message; fb.style.color = 'red'; return;
  }
  const r = await fetch('/api/config/discovery', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: content
  });
  const d = await r.json();
  fb.textContent = d.ok ? 'Mentve.' : ('Hiba: ' + (d.error || '?'));
  fb.style.color = d.ok ? 'green' : 'red';
}

async function runDiscovery() {
  if (!confirm('Figyelem: a Discovery futtatása felülírja a bridge.json konfigurációt!\n\nBiztosan folytatod?')) return;
  const btn = document.getElementById('btn-discovery');
  const spinner = document.getElementById('disc-spinner');
  const log = document.getElementById('disc-log');
  btn.disabled = true;
  spinner.style.display = '';
  log.value = 'Futás…';
  try {
    const r = await fetch('/api/discovery/run', { method: 'POST' });
    const d = await r.json();
    log.value = d.output || (d.ok ? 'Kész.' : 'Hiba.');
  } catch (e) {
    log.value = 'Hálózati hiba: ' + e;
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
  }
}

async function fetchLog() {
  const el = document.getElementById('bridge-log');
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 10;
  try {
    const r = await fetch('/api/bridge/log');
    const d = await r.json();
    if (d.ok) {
      el.value = d.lines;
      if (atBottom) el.scrollTop = el.scrollHeight;
    }
  } catch {}
}

function setLogAuto(on) {
  clearInterval(logTimer);
  logTimer = null;
  if (on) { fetchLog(); logTimer = setInterval(fetchLog, 3000); }
}

fetchStatus();
setInterval(fetchStatus, 5000);
</script>
</body>
</html>
