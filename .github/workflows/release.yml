name: Build and release

# Every push and PR builds and runs the tests; a "v*" tag also packages and
# uploads the release, and only after the tests passed.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

env:
  BRIDGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: debian:trixie

    steps:
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build clang git curl zip unzip pkg-config ca-certificates

      - uses: actions/checkout@v5

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: /opt/vcpkg
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        run: |
          if [ ! -f /opt/vcpkg/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg /opt/vcpkg
            /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DBRIDGE_VERSION=$BRIDGE_VERSION \
            -G Ninja

      - name: Build
        run: ninja -C build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          build/bridge --version
          test "$(build/bridge --version)" = "myIO bridge $BRIDGE_VERSION"

      - name: Strip and package
        if: github.ref_type == 'tag'
        run: |
          strip build/bridge build/discovery
          tar -czf myio-bridge-linux-x86_64.tar.gz -C build bridge discovery

      - name: Upload release artifact
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: myio-bridge-linux-x86_64.tar.gz
